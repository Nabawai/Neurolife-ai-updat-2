name: SIOX Neural Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "neural-worker/**"
      - ".github/workflows/siox-neural-worker.yml"

permissions:
  contents: write
  packages: write

jobs:
  bootstrap-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap SIOX Neural Worker
        shell: bash
        run: |
          mkdir -p neural-worker

          cat > neural-worker/Dockerfile <<'EOF'
          FROM ollama/ollama:latest

          COPY start.sh /opt/neurolife/start.sh
          RUN chmod +x /opt/neurolife/start.sh

          ENV OLLAMA_HOST=0.0.0.0:11434
          ENV OLLAMA_MODEL=qwen2.5:3b
          ENV OLLAMA_EMBED_MODEL=nomic-embed-text
          ENV SIOX_AUTO_PULL_MODEL=1

          EXPOSE 11434

          ENTRYPOINT ["/opt/neurolife/start.sh"]
          EOF

          cat > neural-worker/start.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          export OLLAMA_HOST="${OLLAMA_HOST:-0.0.0.0:11434}"

          ollama serve &
          SERVER_PID=$!

          echo "Waiting for Ollama runtime..."

          READY=0
          for i in $(seq 1 90); do
            if OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "Ollama failed to become ready"
            exit 1
          fi

          if [ "${SIOX_AUTO_PULL_MODEL:-1}" = "1" ]; then
            echo "Loading SIOX text model: ${OLLAMA_MODEL:-qwen2.5:3b}"
            OLLAMA_HOST=127.0.0.1:11434 \
              ollama pull "${OLLAMA_MODEL:-qwen2.5:3b}"

            if [ -n "${OLLAMA_EMBED_MODEL:-}" ]; then
              echo "Loading embeddings model: ${OLLAMA_EMBED_MODEL}"
              OLLAMA_HOST=127.0.0.1:11434 \
                ollama pull "${OLLAMA_EMBED_MODEL}"
            fi
          fi

          echo "SIOX Neural Worker READY"
          wait "$SERVER_PID"
          EOF

          chmod +x neural-worker/start.sh

          cat > neural-worker/docker-compose.yml <<'EOF'
          services:
            siox-neural-worker:
              image: ghcr.io/nabawai/neurolife-siox-neural-worker:latest
              container_name: neurolife-siox-neural-worker
              restart: unless-stopped

              ports:
                - "11434:11434"

              environment:
                OLLAMA_HOST: "0.0.0.0:11434"
                OLLAMA_MODEL: "qwen2.5:3b"
                OLLAMA_EMBED_MODEL: "nomic-embed-text"
                SIOX_AUTO_PULL_MODEL: "1"

              volumes:
                - siox-ollama-data:/root/.ollama

          volumes:
            siox-ollama-data:
          EOF

          cat > neural-worker/README.md <<'EOF'
          # NeuroLife SIOX Hosted Neural Worker

          Sovereign neural execution worker for NeuroLife NODE_CLOUD.

          ## Runtime

          Ollama-based local neural inference.

          Default text model:

          qwen2.5:3b

          Default embedding model:

          nomic-embed-text

          ## Endpoints

          Base URL:

          http://HOST:11434

          Ollama health/model discovery:

          GET /api/tags

          Text generation:

          POST /api/chat

          Embeddings:

          POST /api/embed

          OpenAI-compatible routes are also available through supported
          Ollama OpenAI compatibility endpoints.

          ## NeuroLife configuration

          Adapter:
          OLLAMA

          Base URL:
          http://HOST:11434

          Text model:
          qwen2.5:3b

          Embedding model:
          nomic-embed-text

          This worker is not considered ACTIVE_PROVEN until
          NODE_CLOUD Hosted Neural Compute certification succeeds.

          External provider use by this worker:
          NONE
          EOF

      - name: Commit bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add neural-worker

          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap SIOX Hosted Neural Worker [skip ci]"
            git push
          else
            echo "Worker files already up to date."
          fi

      - name: Configure image name
        shell: bash
        run: |
          echo "SIOX_IMAGE=ghcr.io/nabawai/neurolife-siox-neural-worker" >> "$GITHUB_ENV"

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build SIOX Worker
        shell: bash
        run: |
          docker build \
            -t "$SIOX_IMAGE:latest" \
            -t "$SIOX_IMAGE:${GITHUB_SHA::12}" \
            neural-worker

      - name: Publish SIOX Worker
        shell: bash
        run: |
          docker push "$SIOX_IMAGE:latest"
          docker push "$SIOX_IMAGE:${GITHUB_SHA::12}"

      - name: Build evidence
        shell: bash
        run: |
          {
            echo "SIOX_HOSTED_NEURAL_WORKER_BUILD=PASS"
            echo "IMAGE=$SIOX_IMAGE:latest"
            echo "SOURCE_REPOSITORY=$GITHUB_REPOSITORY"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "EXTERNAL_AI_PROVIDER=NONE"
            echo "RUNTIME=OLLAMA"
            echo "TEXT_MODEL=qwen2.5:3b"
            echo "EMBEDDING_MODEL=nomic-embed-text"
          } | tee siox-worker-build-evidence.txt

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: siox-worker-build-evidence
          path: siox-worker-build-evidence.txt
